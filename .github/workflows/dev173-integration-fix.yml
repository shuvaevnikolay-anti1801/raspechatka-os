name: DEV-173 integration fixer

on:
  push:
    branches:
      - codex/dev-173-pos-cash-drawer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair deterministic merge typos
        shell: python
        run: |
          from pathlib import Path
          p = Path('pos/src/renderer/src/AppV2.tsx')
          s = p.read_text()
          replacements = {
              "onClick={()=>undefined/>}": "onClick={()=>undefined}/>",
              "finally{if(!cancelled)setSearching(false)},120)": "finally{if(!cancelled)setSearching(false)}},120)",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pos/src/renderer/src/AppV2.tsx
          git commit -m "fix: repair DEV-173 integration syntax"
          git push origin HEAD:codex/dev-173-pos-cash-drawer
