name: Integration DEV-174 merger

on:
  push:
    branches:
      - codex/integration-dev-170-176-final

permissions:
  contents: write

jobs:
  merge-dev174:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge reviewed DEV-174
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin codex/dev-174-pos-work-pages
          if git merge-base --is-ancestor origin/codex/dev-174-pos-work-pages HEAD; then
            echo "DEV-174 already integrated"
            exit 0
          fi
          git merge --no-ff origin/codex/dev-174-pos-work-pages -m "integrate: DEV-174 work pages"
          git diff HEAD^1..HEAD --check
          git push origin HEAD:codex/integration-dev-170-176-final
