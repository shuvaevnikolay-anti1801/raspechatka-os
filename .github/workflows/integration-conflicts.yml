name: Integration conflict inspector

on:
  push:
    branches:
      - codex/integration-dev-170-176-final

permissions:
  contents: read

jobs:
  inspect-dev173:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build DEV-173 conflict snapshot
        shell: bash
        run: |
          set -uo pipefail
          git config user.name integration-inspector
          git config user.email integration-inspector@users.noreply.github.com
          git fetch origin codex/dev-173-pos-cash-drawer
          set +e
          git merge --no-commit --no-ff origin/codex/dev-173-pos-cash-drawer
          merge_rc=$?
          set -e
          mkdir -p integration-conflicts/base integration-conflicts/ours integration-conflicts/theirs integration-conflicts/merged
          git diff --name-only --diff-filter=U | tee integration-conflicts/conflicts.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "integration-conflicts/base/$(dirname "$file")" "integration-conflicts/ours/$(dirname "$file")" "integration-conflicts/theirs/$(dirname "$file")" "integration-conflicts/merged/$(dirname "$file")"
            git show ":1:$file" > "integration-conflicts/base/$file" || true
            git show ":2:$file" > "integration-conflicts/ours/$file" || true
            git show ":3:$file" > "integration-conflicts/theirs/$file" || true
            cp "$file" "integration-conflicts/merged/$file" || true
          done < integration-conflicts/conflicts.txt
          printf '%s\n' "$merge_rc" > integration-conflicts/merge-exit-code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integration-conflicts-dev173
          path: integration-conflicts
          if-no-files-found: error
