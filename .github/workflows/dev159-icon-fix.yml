name: DEV-159 icon asset fix

on:
  push:
    paths:
      - .github/workflows/dev159-icon-fix.yml

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Make outer corners transparent and rebuild assets
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          source = Path("pos/build/icon.png")
          image = Image.open(source).convert("RGBA")
          width, height = image.size
          pixels = image.load()

          def is_outer_background(x, y):
              r, g, b, _ = pixels[x, y]
              return min(r, g, b) >= 225 and max(r, g, b) - min(r, g, b) <= 24

          queue = deque()
          seen = set()
          for x in range(width):
              for y in (0, height - 1):
                  if is_outer_background(x, y):
                      queue.append((x, y)); seen.add((x, y))
          for y in range(height):
              for x in (0, width - 1):
                  if is_outer_background(x, y) and (x, y) not in seen:
                      queue.append((x, y)); seen.add((x, y))

          while queue:
              x, y = queue.popleft()
              for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                  if 0 <= nx < width and 0 <= ny < height and (nx, ny) not in seen and is_outer_background(nx, ny):
                      seen.add((nx, ny))
                      queue.append((nx, ny))

          if len(seen) < 100:
              raise SystemExit(f"Refusing icon rewrite: only {len(seen)} edge-background pixels found")

          for x, y in seen:
              r, g, b, _ = pixels[x, y]
              pixels[x, y] = (r, g, b, 0)

          if any(image.getpixel(point)[3] != 0 for point in ((0,0),(width-1,0),(0,height-1),(width-1,height-1))):
              raise SystemExit("Corner transparency verification failed")
          if image.getpixel((width // 2, height // 2))[3] == 0:
              raise SystemExit("Icon center unexpectedly became transparent")

          image.save(source, optimize=True)
          image.save(
              "pos/build/icon.ico",
              format="ICO",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          favicon = Path("frontend/public/favicon.png")
          favicon.parent.mkdir(parents=True, exist_ok=True)
          image.save(favicon, optimize=True)

          png = Image.open(source)
          if png.mode != "RGBA" or png.getpixel((0,0))[3] != 0:
              raise SystemExit("PNG alpha verification failed")
          ico = Image.open("pos/build/icon.ico")
          sizes = set(ico.ico.sizes())
          required = {(16,16),(32,32),(48,48),(256,256)}
          if not required.issubset(sizes):
              raise SystemExit(f"ICO sizes missing: {sorted(required - sizes)}; got {sorted(sizes)}")
          print(f"Transparent edge pixels: {len(seen)}")
          print(f"ICO sizes: {sorted(sizes)}")
          PY
      - name: Commit corrected binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pos/build/icon.png pos/build/icon.ico frontend/public/favicon.png
          if git diff --cached --quiet; then
            echo "No binary changes produced"
            exit 1
          fi
          git commit -m "DEV-159(1): fix app and browser icon transparency"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
